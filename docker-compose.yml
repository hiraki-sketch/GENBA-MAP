services:
  db:
    image: postgis/postgis:16-3.5
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: genba_map
      POSTGRES_USER: genba
      POSTGRES_PASSWORD: genba
    volumes:
      - genba_map_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genba -d genba_map"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  genba_map_pgdata:
